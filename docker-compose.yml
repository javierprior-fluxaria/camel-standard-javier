version: '3.8'

services:
  # Base de datos relacional para ordenes y eventos
  postgres:
    image: postgres:16-alpine
    container_name: fluxaria-postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: fluxaria
      POSTGRES_PASSWORD: fluxaria_password
    ports:
      - "5432:5432"
    volumes:
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxaria -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Broker de mensajeria Kafka (modo KRaft sin necesidad de Zookeeper)
  kafka:
    image: bashj79/kafka-kraft:latest
    container_name: fluxaria-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1